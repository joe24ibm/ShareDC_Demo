name: Continuous Integration Pipeline

on:
  push:
    branches:
      - first-time-homebuyer-discount
  pull_request:
    branches:
      - ShareDC

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          sleep 2

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Validate Source Change
        run: |
          echo "Validating source changes..."
          test -f samples/MortgageApplication/cobol/epsmpmt.cbl
          sleep 3
          echo "Validation complete."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Run Build
        run: |
          echo "Running build..."
          sleep 5
          echo "Build complete."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Tests
        run: |
          echo "Running tests..."
          sleep 4
          echo "Tests passed."

  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Run Code Review Checks
        run: |
          echo "Running code review checks..."
          sleep 4
          echo "Code review checks passed."
